name: Terraform Dev Deploy

on:
  push:
    branches:
      - dev
#      - main
#  pull_request:
#    branches:
#      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-1
      TF_VAR_vpc_name: ${{ vars.TF_VAR_VPC_NAME }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VAR_VPC_CIDR }}
      TF_VAR_availability_zones: ${{ vars.TF_VAR_AVAILABILITY_ZONES }}
      TF_VAR_private_subnets: ${{ vars.TF_VAR_PRIVATE_SUBNETS }}
      TF_VAR_public_subnets: ${{ vars.TF_VAR_PUBLIC_SUBNETS }}
      #commented below lines to be used for main branch deployment with separate github repo variables for prod aws environment. Uncomment the below lines to use them for main branch deployment.
#      AWS_ROLE_ARN: $ {{ github.ref == 'refs/heads/main' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_DEV }}
#      TF_VAR_vpc_name: $ {{ github.ref == 'refs/heads/main' && vars.TF_VAR_VPC_NAME_PROD || vars.TF_VAR_VPC_NAME }}
#      TF_VAR_vpc_cidr: $ {{ github.ref == 'refs/heads/main' && vars.TF_VAR_VPC_CIDR_PROD || vars.TF_VAR_VPC_CIDR }}
#      TF_VAR_availability_zones: $ {{ github.ref == 'refs/heads/main' && vars.TF_VAR_AVAILABILITY_ZONES_PROD || vars.TF_VAR_AVAILABILITY_ZONES }}
#      TF_VAR_private_subnets: $ {{ github.ref == 'refs/heads/main' && vars.TF_VAR_PRIVATE_SUBNETS_PROD || vars.TF_VAR_PRIVATE_SUBNETS }}
#      TF_VAR_public_subnets: $ {{ github.ref == 'refs/heads/main' && vars.TF_VAR_PUBLIC_SUBNETS_PROD || vars.TF_VAR_PUBLIC_SUBNETS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #- name: Debug OIDC token
      #  run: |
      #    curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
      #    | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Destroy
        if: success()
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}"
