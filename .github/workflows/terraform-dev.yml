name: Terraform Dev Deploy

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-1
      TF_VAR_vpc_name: ${{ vars.TF_VAR_VPC_NAME }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VAR_VPC_CIDR }}
      TF_VAR_availability_zones: ${{ vars.TF_VAR_AVAILABILITY_ZONES }}
      TF_VAR_private_subnets: ${{ vars.TF_VAR_PRIVATE_SUBNETS }}
      TF_VAR_public_subnets: ${{ vars.TF_VAR_PUBLIC_SUBNETS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #- name: Debug OIDC token
      #  run: |
      #    curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
      #    | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Destroy
        if: success()
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}"
